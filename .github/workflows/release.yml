name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK and WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip1

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Build release artifacts
        run: |
          cargo build --locked --release -p lavish-browser -p lavish-browser-cli
          cargo build --locked --release -p lavish-browser-zellij --target wasm32-wasip1

      - name: Package release
        run: |
          package="$RUNNER_TEMP/lavish-browser"
          mkdir -p \
            "$package/bin" \
            "$package/share/applications" \
            "$package/share/icons/hicolor/scalable/apps" \
            "$package/share/lavish-browser/zellij"
          install -m 0755 target/release/lavish-browser "$package/bin/"
          install -m 0755 target/release/lavish-open "$package/bin/"
          install -m 0755 target/release/lavish-browser-ctl "$package/bin/"
          install -m 0644 \
            target/wasm32-wasip1/release/lavish_browser_zellij.wasm \
            "$package/share/lavish-browser/zellij/lavish-browser-zellij.wasm"
          install -m 0644 assets/works.from-nibly.LavishBrowser.desktop \
            "$package/share/applications/"
          install -m 0644 assets/works.from-nibly.LavishBrowser.svg \
            "$package/share/icons/hicolor/scalable/apps/"
          tar -C "$RUNNER_TEMP" -czf lavish-browser-x86_64-linux.tar.gz lavish-browser
          sha256sum lavish-browser-x86_64-linux.tar.gz > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              lavish-browser-x86_64-linux.tar.gz SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              lavish-browser-x86_64-linux.tar.gz SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
